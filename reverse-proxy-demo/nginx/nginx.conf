# =============================================================================
# nginx as a reverse proxy - the whole demo in one file.
#
# A reverse proxy sits in front of your servers. Clients talk only to it; it
# decides which backend should answer and speaks to that backend on their behalf.
# ("Forward" proxy is the mirror image: it sits in front of CLIENTS and hides them
# from the internet. Same machinery, opposite direction.)
#
# Every directive below has a comment saying what it does and why you would want it.
# Read this file top to bottom and you have read the lesson.
# =============================================================================

# One worker per CPU core. Each worker is single-threaded and event-driven, which is
# why nginx holds tens of thousands of idle connections on very little memory -
# the property that makes it a good front door for slower application servers.
worker_processes auto;

events {
    worker_connections 1024;   # max simultaneous connections per worker
}

http {
    # ---- Logging ------------------------------------------------------------
    # A custom log format that records what a reverse proxy uniquely knows:
    # which upstream answered, how long the upstream took, and whether the
    # response came out of nginx's cache. Watch it with:
    #   docker compose logs -f nginx
    log_format proxy_log '$remote_addr -> $upstream_addr '
                         '"$request" status=$status '
                         'upstream_time=$upstream_response_time '
                         'total_time=$request_time '
                         'cache=$upstream_cache_status';

    access_log /var/log/nginx/access.log proxy_log;
    error_log  /var/log/nginx/error.log warn;

    # ---- Basics -------------------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Hide the exact nginx version from the Server header. Free, tiny, worth doing:
    # a reverse proxy is also the place where you stop leaking stack details.
    server_tokens off;

    # ---- CONCEPT 5: caching -------------------------------------------------
    # Carve out an on-disk cache. nginx can answer a repeat request itself, without
    # waking the Java app at all. This is the cheapest scaling you will ever get.
    #   levels=1:2        subdirectory layout, keeps directories small
    #   keys_zone         a shared-memory index of what is cached; 10MB holds ~80k keys
    #   max_size          cap on disk used
    #   inactive          drop entries nobody asked for in 10 minutes
    #   use_temp_path=off write straight into the cache dir, skipping a copy
    proxy_cache_path /var/cache/nginx/users_cache
                     levels=1:2
                     keys_zone=users_cache:10m
                     max_size=100m
                     inactive=10m
                     use_temp_path=off;

    # ---- CONCEPT 6: rate limiting -------------------------------------------
    # Define a bucket keyed by client IP, refilling at 5 requests/second.
    # $binary_remote_addr (not $remote_addr) because it is 4 bytes instead of ~15.
    # Declaring the zone does nothing by itself - a location has to opt in with
    # limit_req, which /api/orders/limited does below.
    limit_req_zone $binary_remote_addr zone=orders_limit:10m rate=5r/s;

    # ---- CONCEPT 2: upstreams (load balancing) ------------------------------
    # A named pool of backends. Two containers run the identical orders image, and
    # nginx round-robins between them - the default policy, one request each in turn.
    #
    #   max_fails=1 fail_timeout=10s
    #     If a server errors once, take it out of rotation for 10 seconds, then
    #     quietly try it again. This is CONCEPT 7 (health checks / failover):
    #     stop orders-b and traffic silently drains to orders-a.
    #
    #   keepalive 16
    #     Hold 16 idle connections open to the pool instead of doing a fresh TCP
    #     handshake per request. Needs proxy_http_version 1.1 + clearing the
    #     Connection header, both set in the location blocks below.
    #
    # Other policies you could swap in here:
    #   least_conn;            send to whoever has the fewest active requests
    #   ip_hash;               pin each client IP to one backend (sticky sessions)
    #   server ... weight=3;   send one backend 3x the traffic (bigger machine)
    upstream orders_backend {
        server orders-a:8080 max_fails=1 fail_timeout=10s;
        server orders-b:8080 max_fails=1 fail_timeout=10s;
        keepalive 16;
    }

    upstream users_backend {
        server users-service:8080 max_fails=1 fail_timeout=10s;
        keepalive 16;
    }

    server {
        # ---- CONCEPT 1: one public front door -------------------------------
        # Both listeners, one server block. Plain HTTP on 8080 and TLS on 8443
        # reach exactly the same routes - handy for comparing the two side by side.
        listen 8080;

        # ---- CONCEPT 4: TLS termination -------------------------------------
        # The proxy holds the certificate and does the encryption work. Traffic from
        # here to the Java apps is plain HTTP over the private Docker network, so the
        # apps need no keystore, no cert renewal, no TLS config. One place to rotate
        # certificates, one place to configure ciphers.
        listen 8443 ssl;
        ssl_certificate     /etc/nginx/certs/demo.crt;
        ssl_certificate_key /etc/nginx/certs/demo.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:5m;   # resume sessions, skip repeat handshakes

        server_name localhost;

        # In production you would usually force HTTPS with a redirect here:
        #   if ($scheme = http) { return 301 https://$host$request_uri; }
        # It is left out on purpose so the HTTP walkthrough still works.

        # ---- CONCEPT 3: forwarded headers -----------------------------------
        # Once you introduce a proxy, every backend's idea of "the client" becomes
        # wrong: the TCP peer is nginx, and the Host/scheme/port are nginx's, not the
        # browser's. These headers hand the lost information forward. Set them at the
        # server level and every location below inherits them.
        #
        # $proxy_add_x_forwarded_for appends the current client to any existing
        # X-Forwarded-For, so a chain of proxies builds up "client, proxy1, proxy2".
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # Required for the upstream keepalive pools declared above.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Fail fast rather than hanging a client on a dead backend.
        proxy_connect_timeout 2s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;

        # CONCEPT 7 continued: if a backend refuses, times out or 5xxs, transparently
        # retry the next server in the pool. The client never learns anything happened.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        # A debug header so you can see the routing decision from the outside.
        # Real deployments usually drop this - it exposes internal topology.
        add_header X-Upstream-Server $upstream_addr always;
        add_header X-Proxy-Note      "served via nginx reverse proxy" always;

        # =====================================================================
        # ROUTES. nginx picks the LONGEST matching prefix, not the first one,
        # so /api/orders/limited wins over /api/orders even though it is lower.
        # =====================================================================

        # ---- Rate-limited route (CONCEPT 6) ---------------------------------
        location /api/orders/limited {
            # burst=5   let 5 extra requests queue instead of failing instantly
            # nodelay   serve that burst immediately rather than drip-feeding it
            # Beyond the burst, nginx rejects the request itself. The Java app is
            # never touched - which is the whole point when you are being hammered.
            limit_req zone=orders_limit burst=5 nodelay;
            limit_req_status 503;

            add_header X-Upstream-Server $upstream_addr always;
            add_header X-RateLimit-Policy "5r/s, burst 5" always;

            proxy_pass http://orders_backend;
        }

        # ---- Cached route (CONCEPT 5) ---------------------------------------
        location /api/users/slow {
            proxy_cache users_cache;
            proxy_cache_valid 200 30s;               # keep a 200 for 30 seconds
            proxy_cache_key $scheme$request_method$host$request_uri;

            # If 50 clients ask for an uncached page at once, let ONE through to the
            # backend and make the other 49 wait for that result. Without this, a
            # cache expiry becomes a stampede on your slowest endpoint.
            proxy_cache_lock on;

            # Keep serving the stale copy while a fresh one is fetched in the
            # background, and if the backend is down or erroring. Availability for free.
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;

            # MISS = went to the app. HIT = answered from disk, app never woken.
            add_header X-Cache-Status    $upstream_cache_status always;
            add_header X-Upstream-Server $upstream_addr always;

            proxy_pass http://users_backend;
        }

        # ---- Demo control plane ---------------------------------------------
        # These deliberately BYPASS the upstream pool and talk to one named
        # container each. Everything else about this config balances across the
        # pool; here we must not, because "break orders-b" has to reach orders-b
        # and not whichever replica happens to be next in the rotation.
        #
        # This is the demo's kill switch, not a pattern to copy: a real service
        # would never expose an endpoint that makes it start failing.
        location /_control/orders-a/ {
            proxy_pass http://orders-a:8080/_control/;
        }

        location /_control/orders-b/ {
            proxy_pass http://orders-b:8080/_control/;
        }

        # ---- Path routing (CONCEPT 1) ---------------------------------------
        # Same origin, two entirely separate applications. To the browser this is one
        # server; behind nginx it is a fleet. This is also why a single-page app served
        # from / can call /api/... with no CORS: it is all one origin.
        location /api/orders {
            proxy_pass http://orders_backend;
        }

        location /api/users {
            proxy_pass http://users_backend;
        }

        # ---- What is NOT exposed --------------------------------------------
        # Both apps serve /actuator/health, and there is no location for it. The
        # proxy is an allowlist: anything without a matching route is simply not
        # reachable from outside. Internal endpoints stay internal.
        #
        # docker-compose.yml still uses /actuator/health, from inside the network,
        # to decide when a container is ready.

        # ---- The explainer page ---------------------------------------------
        # nginx serves these static files itself, straight off disk, never touching
        # Java. Static from the proxy, dynamic from the app: the classic split.
        location / {
            root  /usr/share/nginx/html;
            index index.html;
        }

        # A small health endpoint for the proxy itself, answered without any backend.
        location = /proxy-health {
            access_log off;
            default_type application/json;
            return 200 '{"proxy":"nginx","status":"up"}';
        }
    }
}
